<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Card Writer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Great+Vibes&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose: #c9184a;
        --rose-light: #ff4d6d;
        --blush: #fff0f3;
        --gold: #ffb703;
        --cream: #fff8f0;
        --paper: #fffdf9;
        --ink: #4a1942;
        --shadow: rgba(74, 25, 66, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        background-color: #fff0f3;
        overflow-x: hidden;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 12% 18%, rgba(255, 77, 109, 0.1), transparent 32%),
          radial-gradient(circle at 88% 80%, rgba(255, 183, 3, 0.08), transparent 28%);
        pointer-events: none;
      }

      .page-portrait {
        position: relative;
        z-index: 2;
        width: 100%;
        line-height: 0;
        box-shadow: 0 10px 28px rgba(74, 25, 66, 0.18);
      }

      .page-portrait img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
        object-position: center;
      }

      .confetti,
      .burst-confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .burst-confetti {
        z-index: 50;
      }

      .confetti span,
      .burst-confetti i {
        position: absolute;
        top: -12vh;
        width: 8px;
        height: 12px;
        border-radius: 1px;
        opacity: 0.75;
        animation: fall-sway linear infinite;
      }

      .confetti span.round,
      .burst-confetti i.round {
        border-radius: 50%;
        width: 8px;
        height: 8px;
      }

      .confetti span.ribbon,
      .burst-confetti i.ribbon {
        width: 4px;
        height: 14px;
        border-radius: 2px;
      }

      @keyframes fall-sway {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        25% {
          transform: translate3d(18px, 30vh, 0) rotate(180deg);
        }
        50% {
          transform: translate3d(-12px, 60vh, 0) rotate(360deg);
        }
        75% {
          transform: translate3d(14px, 90vh, 0) rotate(540deg);
        }
        100% {
          transform: translate3d(-8px, 120vh, 0) rotate(720deg);
        }
      }

      @keyframes foil-shift {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }

      @keyframes shine-sweep {
        0% { transform: translateX(-140%); }
        55%, 100% { transform: translateX(140%); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      @keyframes balloon-float {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -7px; }
      }

      @keyframes streamer-sway {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(10deg); }
      }

      @keyframes bounce-in {
        0% {
          opacity: 0;
          transform: translateY(-16px) scale(0.96);
        }
        70% {
          transform: translateY(4px) scale(1.01);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      .page {
        position: relative;
        z-index: 2;
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }

      header {
        text-align: center;
        margin-bottom: 36px;
      }

      .hero-images {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
        font-size: 2.6rem;
        line-height: 1;
        animation: wiggle 2.8s ease-in-out infinite;
      }

      .fun-title {
        font-family: "Great Vibes", cursive;
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        font-weight: 400;
        margin: 0 0 10px;
        line-height: 1.15;
        background: linear-gradient(90deg, var(--rose), var(--gold), var(--rose-light), var(--rose));
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 4s linear infinite;
        filter: drop-shadow(0 2px 8px rgba(201, 24, 74, 0.2));
      }

      .subtitle {
        margin: 0;
        font-size: 1.05rem;
        color: #5c3d4a;
        font-weight: 600;
        text-shadow: 0 1px 0 #fff, 0 0 12px rgba(255, 255, 255, 0.95);
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 32px;
        align-items: start;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 16px 48px var(--shadow);
      }

      .panel h2 {
        margin: 0 0 20px;
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--rose);
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #f5d0d9;
        border-radius: 14px;
        font: inherit;
        font-size: 1rem;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--rose-light);
        box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.18);
      }

      .portrait-picker {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .portrait-choice {
        display: block;
        position: relative;
        margin: 0;
        cursor: pointer;
        border: 2px solid #f5d0d9;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .portrait-choice input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      .portrait-choice img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 8;
        object-fit: cover;
        object-position: center;
      }

      .portrait-choice span {
        display: block;
        padding: 8px 10px;
        font-size: 0.85rem;
        font-weight: 700;
        text-align: center;
      }

      .portrait-choice:has(input:checked),
      .portrait-choice:has(input:focus-visible) {
        border-color: var(--rose-light);
        box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.18);
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 16px 20px;
        border: none;
        border-radius: 16px;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, var(--rose-light), var(--rose));
        box-shadow: 0 8px 24px rgba(201, 24, 74, 0.3);
        transition: transform 0.15s, box-shadow 0.15s;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(201, 24, 74, 0.4);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      .lucky-btn {
        background: linear-gradient(135deg, var(--gold), #fb8500);
        box-shadow: 0 8px 24px rgba(255, 183, 3, 0.35);
      }

      .lucky-btn:hover:not(:disabled) {
        box-shadow: 0 12px 28px rgba(255, 183, 3, 0.45);
      }

      .cards-stack {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .card-item {
        animation: bounce-in 0.45s ease-out;
      }

      .card-stage {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px;
      }

      .birthday-card {
        width: 100%;
        max-width: 560px;
      }

      .card-interior {
        width: 100%;
        min-height: 380px;
        display: grid;
        grid-template-columns: 34% minmax(0, 1fr);
        grid-template-rows: auto 1fr;
        grid-template-areas:
          "photo photo"
          "deco note";
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 1px 0 #f4e4b2,
          0 0 0 3px #d4af37,
          0 0 0 5px #fff8e7,
          0 22px 50px rgba(74, 25, 66, 0.22);
        background: var(--paper);
        position: relative;
        --fold: rgba(201, 24, 74, 0.2);
        --ink-soft: #9a6078;
      }

      .card-interior::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(212, 175, 55, 0.45);
        border-radius: 8px;
        pointer-events: none;
        z-index: 4;
        box-shadow: inset 0 0 24px rgba(212, 175, 55, 0.08);
      }

      .card-interior::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 34%;
        width: 2px;
        background: linear-gradient(to bottom, transparent, var(--fold) 15%, var(--fold) 85%, transparent);
        transform: translateX(-50%);
        z-index: 0;
        pointer-events: none;
      }

      .theme-party {
        --fold: rgba(201, 24, 74, 0.22);
      }

      .theme-party .card-left {
        background: linear-gradient(165deg, #fff3d6 0%, #ffe8ef 55%, #ffd6e0 100%);
      }

      .theme-garden {
        --fold: rgba(123, 97, 255, 0.28);
      }

      .theme-garden .card-left {
        background: linear-gradient(165deg, #2b124c 0%, #522b5b 45%, #3d1c4f 100%);
      }

      .theme-garden .party-banner {
        background: linear-gradient(90deg, #c77dff, #7b2cbf);
      }

      .theme-garden .vibe-text {
        color: #e0aaff;
        text-shadow: 0 1px 3px rgba(43, 18, 76, 0.7);
      }

      .theme-garden .age-badge {
        background: linear-gradient(135deg, #7b2cbf, #c77dff);
      }

      .theme-garden .card-right {
        background: linear-gradient(160deg, rgba(224, 170, 255, 0.18), transparent 55%), #fbf7ff;
      }

      .theme-garden .greeting { color: #7b2cbf; }
      .theme-garden .signature { color: #8b6fa8; }
      .theme-garden .card-ribbon {
        background: linear-gradient(135deg, #c77dff, #7b2cbf);
      }

      .theme-carnival {
        --fold: rgba(0, 180, 216, 0.28);
      }

      .theme-carnival .card-left {
        background: linear-gradient(165deg, #fff3b0 0%, #90e0ef 50%, #48cae4 100%);
      }

      .theme-carnival .party-banner {
        background: linear-gradient(90deg, #ff9f1c, #e71d36);
      }

      .theme-carnival .vibe-text {
        color: #0077b6;
      }

      .theme-carnival .age-badge {
        background: linear-gradient(135deg, #0077b6, #00b4d8);
      }

      .theme-carnival .card-right {
        background: linear-gradient(160deg, rgba(144, 224, 239, 0.28), transparent 55%), #fffdf5;
      }

      .theme-carnival .greeting { color: #e71d36; }
      .theme-carnival .signature { color: #0077b6; }
      .theme-carnival .card-ribbon {
        background: linear-gradient(135deg, #ff9f1c, #e71d36);
      }

      .card-left,
      .card-right {
        padding: 20px 16px;
        position: relative;
        min-width: 0;
      }

      .card-left {
        grid-area: deco;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-right: 1px solid rgba(201, 24, 74, 0.15);
        gap: 4px;
        overflow: hidden;
        min-height: 380px;
      }

      .card-portrait-strip {
        grid-area: photo;
        width: 100%;
        height: auto;
        aspect-ratio: 1080 / 533;
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        box-shadow: inset 0 -2px 0 rgba(212, 175, 55, 0.45);
        z-index: 1;
      }

      .card-left .balloon,
      .card-left .deco-star,
      .card-left .deco-moon,
      .card-left .streamer,
      .card-left .card-confetti {
        z-index: 1;
      }

      .balloon {
        position: absolute;
        width: 28px;
        height: 36px;
        border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
        box-shadow:
          inset -6px -4px 0 rgba(0, 0, 0, 0.08),
          inset 5px 6px 0 rgba(255, 255, 255, 0.28);
        animation: balloon-float 3.2s ease-in-out infinite;
      }

      .balloon::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -18px;
        width: 1px;
        height: 18px;
        background: #8b5a7a;
      }

      .balloon.red { background: #ff4d6d; top: 14px; left: 14px; }
      .balloon.gold { background: #ffb703; top: 8px; right: 18px; transform: rotate(8deg); }
      .balloon.rose { background: #c9184a; bottom: 22px; left: 18px; transform: rotate(-10deg); }
      .balloon.teal { background: #00b4d8; top: 18px; left: 42%; transform: rotate(-6deg); }
      .balloon.orange { background: #ff9f1c; bottom: 28px; right: 16px; transform: rotate(12deg); }

      .deco-star {
        position: absolute;
        width: 10px;
        height: 10px;
        background: radial-gradient(circle at 30% 30%, #fff, #ffe566);
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        animation: twinkle 2.2s ease-in-out infinite;
      }

      .deco-moon {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #ffe566;
        box-shadow: -8px 0 0 0 #2b124c;
      }

      .streamer {
        position: absolute;
        top: 0;
        width: 8px;
        height: 54px;
        border-radius: 0 0 8px 8px;
        transform-origin: top center;
        animation: streamer-sway 2.4s ease-in-out infinite;
      }

      .streamer.s1 { left: 18%; background: linear-gradient(#e71d36, #ff8fa3); animation-delay: 0s; }
      .streamer.s2 { left: 46%; background: linear-gradient(#ff9f1c, #ffe08a); animation-delay: 0.3s; }
      .streamer.s3 { left: 72%; background: linear-gradient(#0077b6, #90e0ef); animation-delay: 0.6s; }

      .card-confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .card-confetti i {
        position: absolute;
        display: block;
        border-radius: 2px;
      }

      .card-left-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .card-left .party-banner {
        margin: 0 0 2px;
        padding: 5px 16px;
        border-radius: 999px;
        background: linear-gradient(120deg, #d4af37, #fff1b8, #c9a227, #ffe08a, #d4af37);
        background-size: 220% 220%;
        animation: foil-shift 3.5s linear infinite;
        color: #5c3d00;
        font-family: "Cormorant Garamond", serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        box-shadow: 0 3px 10px rgba(212, 175, 55, 0.4);
        position: relative;
        overflow: hidden;
      }

      .card-left .party-banner::after,
      .card-left .age-badge::after,
      .card-ribbon::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, 0.7) 50%, transparent 65%);
        animation: shine-sweep 2.8s ease-in-out infinite;
        pointer-events: none;
      }

      .card-left .art-row {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 6px;
        margin: 2px 0;
      }

      .card-left .art-row svg {
        display: block;
        filter: drop-shadow(0 4px 6px rgba(74, 25, 66, 0.2));
      }

      .card-left .cake-svg {
        width: 88px;
        height: 88px;
      }

      .card-left .rose-svg {
        width: 64px;
        height: 80px;
      }

      .card-left .vibe-text {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.25;
        max-width: 100%;
        padding: 0 4px;
        color: #c9184a;
        text-shadow: 0 1px 2px rgba(255, 253, 249, 0.85);
      }

      .card-left .age-badge {
        min-width: 92px;
        padding: 8px 14px 6px;
        border-radius: 999px;
        background: linear-gradient(120deg, #c9184a, #ff8fab, #c9184a, #ff4d6d);
        background-size: 220% 220%;
        animation: foil-shift 3.8s linear infinite;
        color: #fff;
        text-align: center;
        box-shadow: 0 6px 16px rgba(201, 24, 74, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        margin-top: 2px;
        position: relative;
        overflow: hidden;
      }

      .card-left .age-display {
        font-family: "Caveat", cursive;
        font-size: 2.3rem;
        font-weight: 700;
        color: #fff;
        margin: 0;
        line-height: 0.9;
      }

      .card-left .age-label {
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #ffe8ef;
        margin: 2px 0 0;
      }

      .card-right {
        grid-area: note;
        background:
          linear-gradient(160deg, rgba(255, 240, 243, 0.6), transparent 55%),
          var(--paper);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 24px 22px 20px 20px;
      }

      .card-right .greeting,
      .card-right .message,
      .card-right .signature {
        font-family: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
        font-variant-numeric: lining-nums;
        overflow-wrap: break-word;
        word-break: normal;
        hyphens: none;
        letter-spacing: 0.01em;
      }

      .card-right .greeting {
        font-size: 1.55rem;
        font-weight: 400;
        line-height: 1.3;
        color: var(--rose);
        margin: 0 0 12px;
      }

      .card-right .message {
        font-size: 1.2rem;
        font-weight: 400;
        line-height: 1.5;
        color: var(--ink);
        margin: 0;
        white-space: pre-wrap;
      }

      .card-right .signature {
        font-size: 1.15rem;
        font-weight: 400;
        line-height: 1.35;
        color: #9a6078;
        margin: 18px 0 0;
        text-align: left;
      }

      @media (max-width: 480px) {
        .card-interior {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto auto;
          grid-template-areas:
            "photo"
            "note"
            "deco";
        }

        .card-interior::before {
          display: none;
        }

        .card-left {
          min-height: 240px;
          border-right: none;
          border-top: 1px solid rgba(201, 24, 74, 0.12);
        }

        .card-right {
          padding: 22px 20px 18px;
        }

        .card-right .greeting {
          font-size: 1.45rem;
        }

        .card-right .message {
          font-size: 1.15rem;
        }
      }

      .card-ribbon {
        position: absolute;
        top: -6px;
        right: 20px;
        background: linear-gradient(120deg, #d4af37, #fff1b8, #c9a227, #ffe08a, #d4af37);
        background-size: 220% 220%;
        animation: foil-shift 3.2s linear infinite;
        color: #5c3d00;
        font-family: "Cormorant Garamond", serif;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 7px 14px;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 4px 14px rgba(212, 175, 55, 0.4);
        z-index: 5;
        overflow: hidden;
      }

      .flourish {
        position: absolute;
        width: 28px;
        height: 28px;
        z-index: 5;
        opacity: 0.7;
        background:
          radial-gradient(circle at 30% 30%, #fff8dc, transparent 40%),
          conic-gradient(from 40deg, #d4af37, #fff1b8, #c9a227, #d4af37);
        clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        animation: twinkle 3s ease-in-out infinite;
      }

      .flourish.tl { top: 10px; left: 10px; }
      .flourish.tr { top: 10px; right: 10px; }
      .flourish.bl { bottom: 10px; left: 10px; }
      .flourish.br { bottom: 10px; right: 10px; }

      .card-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;

      const roseSvg = `

      function leftPanelHtml(age, theme) {

      function getPortrait(id) {

      function getSelectedPortrait() {
        const checked = document.querySelector('input[name="portrait"]:checked');
        return getPortrait(checked?.value);

      function loadPortrait(src) {
        const cached = portraitCache.get(src);
        if (cached) {
          return cached;
        }
        const promise = new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        });
        portraitCache.set(src, promise);
        return promise;
      }

      function syncPagePortrait(src) {

      function wrapCanvasText(ctx, text, maxWidth) {
        const lines = [];

        for (const paragraph of text.split("\n")) {
          if (!paragraph) {
            lines.push("");
            continue;
          }

          const words = paragraph.split(/\s+/);
          let current = "";

          for (const word of words) {
            const test = current ? `${current} ${word}` : word;
            if (ctx.measureText(test).width > maxWidth && current) {
              lines.push(current);
              current = word;
            } else {
              current = test;
            }
          }

          if (current) lines.push(current);
        }

        return lines;
      }

      function drawRoundRect(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function drawBalloon(ctx, x, y, color) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x, y, 22, 28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.beginPath();
        ctx.ellipse(x - 7, y - 8, 6, 9, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#8b5a7a";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y + 28);
        ctx.quadraticCurveTo(x + 4, y + 48, x, y + 62);
        ctx.stroke();
        ctx.restore();
      }

      function drawStar(ctx, x, y, size, color) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (Math.PI / 2) * 3 + i * ((Math.PI * 2) / 5);
          const r = i % 2 === 0 ? size : size / 2.2;
          const px = x + Math.cos(a) * r;
          const py = y + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawRoseBloom(ctx, x, y) {
        ctx.save();
        ctx.strokeStyle = "#2a9d8f";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y + 70);
        ctx.quadraticCurveTo(x - 6, y + 40, x, y + 20);
        ctx.stroke();
        ctx.fillStyle = "#c9184a";
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ff4d6d";
        ctx.beginPath();
        ctx.arc(x - 8, y - 4, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ff758f";
        ctx.beginPath();
        ctx.arc(x + 4, y - 10, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCake(ctx, x, y) {
        ctx.save();

        drawRoundRect(ctx, x - 38, y + 46, 76, 28, 6);
        ctx.fill();
        ctx.fillStyle = "#fff5f0";
        drawRoundRect(ctx, x - 38, y + 40, 76, 12, 5);
        ctx.fill();
        ctx.fillStyle = "#e76f51";
        drawRoundRect(ctx, x - 28, y + 22, 56, 22, 5);
        ctx.fill();
        ctx.fillStyle = "#fff5f0";
        drawRoundRect(ctx, x - 28, y + 16, 56, 10, 4);
        ctx.fill();
        ctx.fillStyle = "#f4a261";
        drawRoundRect(ctx, x - 18, y + 2, 36, 16, 4);
        ctx.fill();
        ctx.fillStyle = "#fff5f0";
        drawRoundRect(ctx, x - 18, y - 4, 36, 10, 4);
        ctx.fill();
        const candles = [
          [x - 10, y - 22, "#ff4d6d"],
          [x, y - 28, "#ffb703"],
          [x + 10, y - 22, "#ff4d6d"],
        ];
        for (const [cx, cy, flame] of candles) {
          ctx.fillStyle = "#ffd166";
          ctx.fillRect(cx - 2, cy + 8, 4, 16);
          ctx.fillStyle = flame;
          ctx.beginPath();
          ctx.ellipse(cx, cy + 4, 4, 6, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function paintThemeDecor(ctx, themeId, leftW, height, originY) {
        const y0 = originY;

          ctx.fillStyle = "#ffe566";

          ctx.fill();
          ctx.fillStyle = "#2b124c";
          ctx.beginPath();
          ctx.arc(leftW - 58, y0 + 64, 20, 0, Math.PI * 2);
          ctx.fill();

            [50, 50], [140, 90], [230, 40], [80, 200], [360, 120],
            [40, 340], [400, 280], [180, 420], [320, 500], [90, 580],
          ];

            const yy = y0 + sy;
            if (yy < height - 24) {
              drawStar(ctx, sx, yy, 8 + (sx % 5), "#ffe566");
            }
          }
          return;

        if (themeId === "carnival") {
          const streamers = [
            [90, "#e71d36"], [230, "#ff9f1c"], [370, "#0077b6"],
          ];
          for (const [sx, color] of streamers) {

            ctx.fill();
          }
          drawBalloon(ctx, 80, y0 + 140, "#00b4d8");
          drawBalloon(ctx, 410, y0 + 110, "#ff9f1c");
          drawBalloon(ctx, 120, height - 150, "#ffb703");
          return;
        }

        drawBalloon(ctx, 70, y0 + 90, "#ff4d6d");
        drawBalloon(ctx, 420, y0 + 80, "#ffb703");
        drawBalloon(ctx, 90, height - 140, "#c9184a");
      }

      async function paintSavedCard(name, age, message, theme, portraitChoice) {
        const width = 1200;
        const leftW = 500;
        const pad = 48;
        const measure = document.createElement("canvas").getContext("2d");
        measure.font = "32px Patrick Hand, Segoe Print, cursive";
        const greeting = `Dear ${name},`;
        const bodyLines = wrapCanvasText(measure, message, width - leftW - pad * 2);
        const sign = theme.sign;
        const chosen = portraitChoice || PORTRAITS.home;
        const portrait = await loadPortrait(chosen.src);
        const sourceW = portrait?.naturalWidth || chosen.width;
        const sourceH = portrait?.naturalHeight || chosen.height;
        const stripH = Math.round(width * sourceH / sourceW);
        const panelH = 440;
        const textHeight = stripH + 50 + bodyLines.length * 40 + 70;
        const height = Math.max(stripH + panelH, textHeight + 80);

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        const palettes = {
          party: {
            left: ["#fff3d6", "#ffe8ef", "#ffd6e0"],
            right: "#fffdf9",
            confetti: ["#ff4d6d", "#ffb703", "#c9184a", "#fb8500", "#2a9d8f"],
            banner: "#ffb703",
            vibe: "#c9184a",
            badge: ["#c9184a", "#ff4d6d"],
            fold: "rgba(201, 24, 74, 0.25)",
            ribbon: ["#ffb703", "#ff4d6d"],
            greet: "#c9184a",
            body: "#4a1942",
            sign: "#9a6078",
          },
          garden: {
            left: ["#2b124c", "#522b5b", "#3d1c4f"],
            right: "#fbf7ff",
            confetti: ["#ffe566", "#c77dff", "#e0aaff"],
            banner: "#7b2cbf",
            vibe: "#e0aaff",
            badge: ["#7b2cbf", "#c77dff"],
            fold: "rgba(123, 97, 255, 0.3)",
            ribbon: ["#c77dff", "#7b2cbf"],
            greet: "#7b2cbf",
            body: "#3d2463",
            sign: "#8b6fa8",
          },
          carnival: {
            left: ["#fff3b0", "#90e0ef", "#48cae4"],
            right: "#fffdf5",
            confetti: ["#e71d36", "#ff9f1c", "#0077b6", "#00b4d8"],
            banner: "#e71d36",
            vibe: "#0077b6",
            badge: ["#0077b6", "#00b4d8"],
            fold: "rgba(0, 180, 216, 0.3)",
            ribbon: ["#ff9f1c", "#e71d36"],
            greet: "#e71d36",
            body: "#023047",
            sign: "#0077b6",
          },
        };
        const p = palettes[theme.id] || palettes.party;

        const leftGrad = ctx.createLinearGradient(0, 0, leftW, height);
        leftGrad.addColorStop(0, p.left[0]);
        leftGrad.addColorStop(0.55, p.left[1]);
        leftGrad.addColorStop(1, p.left[2]);
        ctx.fillStyle = leftGrad;
        ctx.fillRect(0, 0, leftW, height);

        ctx.fillStyle = p.right;
        ctx.fillRect(leftW, 0, width - leftW, height);

        if (portrait) {
          ctx.drawImage(portrait, 0, 0, width, stripH);
          ctx.fillStyle = "rgba(212, 175, 55, 0.55)";
          ctx.fillRect(0, stripH - 3, width, 3);
        }

        const confetti = [
          [40, 40], [120, 90], [220, 50], [80, 180], [300, 140], [360, 80],
          [60, 320], [400, 260], [180, 280], [90, 480], [340, 420], [250, 520],
          [430, 560], [30, 600], [150, 640], [380, 640], [280, 200], [420, 180],
        ];
        confetti.forEach(([cx, cy], i) => {
          const y = stripH + 20 + cy * 0.45;
          if (y >= height - 24) {
            return;
          }
          ctx.save();
          ctx.translate(cx, y);
          ctx.rotate(0.4 + i * 0.2);
          ctx.fillStyle = p.confetti[i % p.confetti.length];
          ctx.fillRect(-6, -6, 12, 12);
          ctx.restore();
        });

        paintThemeDecor(ctx, theme.id, leftW, height, stripH);

        ctx.fillStyle = p.banner;
        drawRoundRect(ctx, leftW / 2 - 100, stripH + 24, 200, 36, 18);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "800 18px Nunito, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(theme.banner.toUpperCase(), leftW / 2, stripH + 48);

        ctx.fillStyle = p.vibe;
        ctx.font = "800 16px Nunito, sans-serif";
        ctx.fillText(theme.vibe.toUpperCase(), leftW / 2, stripH + 78);

        if (theme.id === "garden") {
          drawRoseBloom(ctx, leftW / 2 - 40, stripH + 170);
          drawRoseBloom(ctx, leftW / 2 + 40, stripH + 190);
        } else {
          drawCake(ctx, leftW / 2, stripH + 180);
          if (theme.id === "party") {
            drawRoseBloom(ctx, leftW / 2 + 90, stripH + 210);
          }
        }

        const badgeY = stripH + 330;
        const badgeGrad = ctx.createLinearGradient(leftW / 2 - 80, badgeY, leftW / 2 + 80, badgeY + 80);
        badgeGrad.addColorStop(0, p.badge[0]);
        badgeGrad.addColorStop(1, p.badge[1]);
        ctx.fillStyle = badgeGrad;
        drawRoundRect(ctx, leftW / 2 - 80, badgeY, 160, 86, 43);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 52px Caveat, cursive, sans-serif";
        ctx.fillText(String(age), leftW / 2, badgeY + 50);
        ctx.font = "800 14px Nunito, sans-serif";
        ctx.fillText("YEARS YOUNG", leftW / 2, badgeY + 72);

        ctx.strokeStyle = p.fold;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(leftW, stripH);
        ctx.lineTo(leftW, height);
        ctx.stroke();

        const ribbonGrad = ctx.createLinearGradient(width - 300, 0, width - 40, 0);
        ribbonGrad.addColorStop(0, p.ribbon[0]);
        ribbonGrad.addColorStop(1, p.ribbon[1]);
        ctx.fillStyle = ribbonGrad;
        drawRoundRect(ctx, width - 300, 0, 240, 48, 12);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "800 15px Nunito, sans-serif";
        ctx.fillText(theme.ribbon.toUpperCase(), width - 180, 30);

        let ty = stripH + 56;
        ctx.textAlign = "left";
        ctx.fillStyle = p.greet;
        ctx.font = "36px Patrick Hand, Segoe Print, cursive";
        ctx.fillText(greeting, leftW + pad, ty);
        ty += 50;

        ctx.fillStyle = p.body;
        ctx.font = "32px Patrick Hand, Segoe Print, cursive";
        for (const line of bodyLines) {
          ctx.fillText(line, leftW + pad, ty);
          ty += 38;
        }

        ctx.fillStyle = p.sign;
        ctx.font = "30px Patrick Hand, Segoe Print, cursive";
        ctx.textAlign = "right";
        ctx.fillText(sign, width - pad, height - 40);

        ctx.strokeStyle = "#d4af37";
        ctx.lineWidth = 10;
        ctx.strokeRect(8, 8, width - 16, height - 16);
        ctx.strokeStyle = "#fff8e7";
        ctx.lineWidth = 3;
        ctx.strokeRect(18, 18, width - 36, height - 36);
        ctx.strokeStyle = "rgba(212, 175, 55, 0.55)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(28, 28, width - 56, height - 56);

        const sheen = ctx.createLinearGradient(0, 0, width, height);
        sheen.addColorStop(0.35, "rgba(255,255,255,0)");
        sheen.addColorStop(0.48, "rgba(255,255,255,0.16)");
        sheen.addColorStop(0.52, "rgba(255,241,184,0.12)");
        sheen.addColorStop(0.65, "rgba(255,255,255,0)");
        ctx.fillStyle = sheen;
        ctx.fillRect(0, 0, width, height);

        return canvas;
      }

      async function renderCardImage(_cardInterior, name, age, message, theme, portraitChoice) {
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }

        const canvas = await paintSavedCard(name, age, message, theme, portraitChoice);
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("Failed to create image"));
          }, "image/png");
        });
      }

      function createCardElement(name, age, message, theme, portraitChoice) {
        const item = document.createElement("article");
        item.className = "card-item";
        const portrait = portraitChoice || PORTRAITS.home;

        item.innerHTML = `
          <div class="card-stage">
            <div class="birthday-card">
              <div class="card-interior theme-${theme.id}">
                <div class="card-portrait-strip" role="img" aria-label="${escapeHtml(portrait.label)}" style="background-image: url('${portrait.src}'); aspect-ratio: ${portrait.width} / ${portrait.height};"></div>
                <span class="flourish tl" aria-hidden="true"></span>
                <span class="flourish tr" aria-hidden="true"></span>
                <span class="flourish bl" aria-hidden="true"></span>
                <span class="flourish br" aria-hidden="true"></span>
                <span class="card-ribbon">${escapeHtml(theme.ribbon)}</span>
                <div class="card-left">
                  ${leftPanelHtml(age, theme)}
                </div>
                <div class="card-right">
                  <p class="greeting">Dear ${escapeHtml(name)},</p>
                  <p class="message">${escapeHtml(message)}</p>
                  <p class="signature">${escapeHtml(theme.sign)}</p>
                </div>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button type="button" class="save-btn">Save card to Messages</button>
            <button type="button" class="copy-btn">Copy card &amp; message</button>
          </div>
        `;

        const saveBtn = item.querySelector(".save-btn");
        const copyBtn = item.querySelector(".copy-btn");
        saveBtn.addEventListener("click", () => saveCardToMessages(item, name, age, message, theme, saveBtn, portrait));
        copyBtn.addEventListener("click", () => copyCard(item, name, age, message, theme, copyBtn, portrait));

        return item;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      async function saveCardToMessages(item, name, age, message, theme, button, portraitChoice) {
        const cardInterior = item.querySelector(".card-interior");
        const text = formatCardText(name, age, message);
        const filename = `birthday-card-${name.toLowerCase().replace(/\s+/g, "-")}.png`;

        button.disabled = true;
        button.textContent = "Saving…";

        try {
          const imageBlob = await renderCardImage(cardInterior, name, age, message, theme, portraitChoice);
          const file = new File([imageBlob], filename, { type: "image/png" });

          if (navigator.share) {
            const shareData = {
              title: `Happy Birthday, ${name}!`,
              text,
              files: [file],
            };

            if (!navigator.canShare || navigator.canShare(shareData)) {
              await navigator.share(shareData);
              showToast("Card ready — pick Messages to send!");
              return;
            }
          }

          downloadBlob(imageBlob, filename);
          showToast("Card saved! Open Photos, then share to Messages.");
        } catch (err) {
          if (err?.name === "AbortError") return;
          try {
            const imageBlob = await renderCardImage(cardInterior, name, age, message, theme, portraitChoice);
            downloadBlob(imageBlob, filename);
            showToast("Card downloaded — share it from your Photos app!");
          } catch {
            showToast("Could not save card — try again");
          }
        } finally {
          button.disabled = false;
          button.textContent = "Save card to Messages";
        }
      }

      async function copyCard(item, name, age, message, theme, button, portraitChoice) {
        const cardInterior = item.querySelector(".card-interior");
        const text = formatCardText(name, age, message);

        button.disabled = true;
        button.textContent = "Copying…";

        try {
          const imageBlob = await renderCardImage(cardInterior, name, age, message, theme, portraitChoice);
          const textBlob = new Blob([text], { type: "text/plain" });

          if (typeof ClipboardItem !== "undefined" && navigator.clipboard?.write) {
            try {
              await navigator.clipboard.write([
                new ClipboardItem({
                  "text/plain": textBlob,
                  "image/png": imageBlob,
                }),
              ]);
              showToast("Card image & message copied!");
              return;
            } catch {
              // Fall through
            }
          }

          if (navigator.clipboard?.write) {
            await navigator.clipboard.write([new ClipboardItem({ "image/png": imageBlob })]);
            showToast("Card image copied!");
            return;
          }

          await navigator.clipboard.writeText(text);
          showToast("Message copied!");
        } catch {
          try {
            await navigator.clipboard.writeText(text);
            showToast("Message copied!");
          } catch {
            showToast("Could not copy — try Save card to Messages");
          }
        } finally {
          button.disabled = false;
          button.textContent = "Copy card & message";
        }
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function addCard(name, age, hobby) {
        const message = generateMessage(name, age, hobby);
        const theme = pickTheme();
        const portrait = getSelectedPortrait();
        const card = createCardElement(name, age, message, theme, portrait);
        emptyState.hidden = true;
        cardsStack.hidden = false;
        cardsStack.prepend(card);
        burstConfetti();
      }

      const form = document.getElementById("card-form");
      const cardsStack = document.getElementById("cards-stack");
      const emptyState = document.getElementById("empty-state");
      const luckyBtn = document.getElementById("lucky-btn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const age = parseInt(document.getElementById("age").value, 10);
        const hobby = document.getElementById("hobby").value.trim();

        if (!name || !hobby || !age) return;
        addCard(name, age, hobby);
      });

      luckyBtn.addEventListener("click", () => {
        const name = pickRandom(luckyNames);
        const age = Math.floor(Math.random() * 53) + 18;
        const hobby = pickRandom(luckyHobbies);

        document.getElementById("name").value = name;
        document.getElementById("age").value = age;
        document.getElementById("hobby").value = hobby;

        addCard(name, age, hobby);
        showToast(`Lucky pick: ${name}, ${age}, loves ${hobby}!`);
      });

      document.querySelectorAll('input[name="portrait"]').forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) {
            syncPagePortrait(getPortrait(input.value).src);
          }
        });
      });
    </script>
  </body>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Card Writer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      :root {
        --rose: #c9184a;
        --rose-light: #ff4d6d;
        --blush: #fff0f3;
        --gold: #ffb703;
        --cream: #fff8f0;
        --paper: #fffdf9;
        --ink: #4a1942;
        --shadow: rgba(74, 25, 66, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 15%, rgba(255, 77, 109, 0.18), transparent 35%),
          radial-gradient(circle at 90% 80%, rgba(255, 183, 3, 0.15), transparent 30%),
          linear-gradient(160deg, #fff0f3 0%, #fff8f0 40%, #ffe5ec 100%);
        overflow-x: hidden;
      }

      .confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .confetti span {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        opacity: 0.5;
        animation: drift 12s linear infinite;
      }

      @keyframes drift {
        0% {
          transform: translateY(-10vh) rotate(0deg);
        }
        100% {
          transform: translateY(110vh) rotate(720deg);
        }
      }

      @keyframes bounce-in {
        0% {
          opacity: 0;
          transform: translateY(-16px) scale(0.96);
        }
        70% {
          transform: translateY(4px) scale(1.01);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }

      header {
        text-align: center;
        margin-bottom: 36px;
      }

      .hero-images {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-bottom: 12px;
      }

      .hero-images img {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 8px 24px var(--shadow);
        animation: float 3s ease-in-out infinite;
      }

      .hero-images img:last-child {
        animation-delay: 1.5s;
      }

      .fun-title {
        font-family: "Pacifico", cursive;
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        font-weight: 400;
        margin: 0 0 10px;
        line-height: 1.15;
        background: linear-gradient(90deg, var(--rose), var(--gold), var(--rose-light), var(--rose));
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 4s linear infinite;
        filter: drop-shadow(0 2px 8px rgba(201, 24, 74, 0.2));
      }

      .subtitle {
        margin: 0;
        font-size: 1.05rem;
        color: #8b5a7a;
        font-weight: 600;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 32px;
        align-items: start;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 16px 48px var(--shadow);
      }

      .panel h2 {
        margin: 0 0 20px;
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--rose);
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #f5d0d9;
        border-radius: 14px;
        font: inherit;
        font-size: 1rem;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--rose-light);
        box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.18);
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 16px 20px;
        border: none;
        border-radius: 16px;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, var(--rose-light), var(--rose));
        box-shadow: 0 8px 24px rgba(201, 24, 74, 0.3);
        transition: transform 0.15s, box-shadow 0.15s;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(201, 24, 74, 0.4);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      .lucky-btn {
        background: linear-gradient(135deg, var(--gold), #fb8500);
        box-shadow: 0 8px 24px rgba(255, 183, 3, 0.35);
      }

      .lucky-btn:hover:not(:disabled) {
        box-shadow: 0 12px 28px rgba(255, 183, 3, 0.45);
      }

      .cards-stack {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .card-item {
        animation: bounce-in 0.45s ease-out;
      }

      .card-stage {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px;
      }

      .birthday-card {
        width: 100%;
        max-width: 480px;
        aspect-ratio: 4 / 3;
      }

      .card-interior {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 2px 0 #f0d4c8,
          0 20px 50px rgba(74, 25, 66, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.7);
        background: var(--paper);
        position: relative;
      }

      .card-interior::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(201, 24, 74, 0.2) 15%,
          rgba(201, 24, 74, 0.2) 85%,
          transparent
        );
        transform: translateX(-50%);
        z-index: 2;
        pointer-events: none;
      }

      .card-left,
      .card-right {
        padding: 20px 18px;
        position: relative;
      }

      .card-left {
        background:
          radial-gradient(circle at 30% 20%, rgba(255, 183, 3, 0.2), transparent 50%),
          radial-gradient(circle at 70% 80%, rgba(201, 24, 74, 0.12), transparent 45%),
          var(--cream);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-right: 1px solid rgba(201, 24, 74, 0.15);
        gap: 8px;
      }

      .card-photos {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
      }

      .card-photos img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid #fff;
        box-shadow: 0 4px 12px rgba(74, 25, 66, 0.15);
      }

      .card-left .age-display {
        font-family: "Caveat", cursive;
        font-size: 2.6rem;
        font-weight: 700;
        color: var(--rose);
        margin: 4px 0 0;
        line-height: 1;
      }

      .card-left .age-label {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #b07a8f;
        margin: 0;
      }

      .card-right {
        background:
          linear-gradient(160deg, rgba(255, 240, 243, 0.6), transparent 55%),
          var(--paper);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .card-right .greeting {
        font-family: "Caveat", cursive;
        font-size: 1.55rem;
        font-weight: 700;
        color: var(--rose);
        margin: 0 0 10px;
      }

      .card-right .message {
        font-family: "Caveat", cursive;
        font-size: 1.25rem;
        line-height: 1.5;
        color: var(--ink);
        margin: 0 0 16px;
        min-height: 90px;
      }

      .card-right .signature {
        font-family: "Caveat", cursive;
        font-size: 1.15rem;
        color: #9a6078;
        margin: 0;
        text-align: right;
      }

      .card-ribbon {
        position: absolute;
        top: -6px;
        right: 20px;
        background: linear-gradient(135deg, var(--gold), var(--rose-light));
        color: #fff;
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 6px 12px;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 4px 12px rgba(201, 24, 74, 0.35);
        z-index: 3;
      }

      .card-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .card-actions button {
        margin-top: 0;
        font-size: 0.88rem;
        padding: 12px 10px;
      }

      .save-btn {
        background: linear-gradient(135deg, #2a9d8f, #1d7a6f);
        box-shadow: 0 8px 20px rgba(42, 157, 143, 0.3);
      }

      .copy-btn {
        background: linear-gradient(135deg, #e07a5f, var(--rose));
        box-shadow: 0 8px 20px rgba(224, 122, 95, 0.3);
      }

      .card-actions button:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }

      .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: #b07a8f;
        font-weight: 600;
        line-height: 1.6;
      }

      .empty-state .empty-icon {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .empty-state .empty-icon img {
        width: 56px;
        height: 56px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 6px 16px var(--shadow);
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--ink);
        color: #fff;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        opacity: 0;
        transition: transform 0.3s, opacity 0.3s;
        z-index: 100;
        pointer-events: none;
        max-width: 90vw;
        text-align: center;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="confetti" aria-hidden="true" id="confetti"></div>

    <div class="page">
      <header>
        <div class="hero-images" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=200&h=200&fit=crop&q=80"
            alt=""
            width="72"
            height="72"
            crossorigin="anonymous"
          />
          <img
            src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=200&h=200&fit=crop&q=80"
            alt=""
            width="72"
            height="72"
            crossorigin="anonymous"
          />
        </div>
        <h1 class="fun-title">Wit &amp; Wishes Card Factory</h1>
        <p class="subtitle">Cake, roses &amp; laughs — birthday cards with serious good vibes</p>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Tell us about the birthday star</h2>
          <form id="card-form">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" placeholder="e.g. Alex" required />
            </div>
            <div class="field">
              <label for="age">Age</label>
              <input id="age" name="age" type="number" min="1" max="120" placeholder="e.g. 30" required />
            </div>
            <div class="field">
              <label for="hobby">Hobby</label>
              <input id="hobby" name="hobby" type="text" placeholder="e.g. baking, hiking, gaming" required />
            </div>
            <button type="submit">Generate Funny Message</button>
            <button type="button" class="lucky-btn" id="lucky-btn">I'm Feeling Lucky</button>
          </form>
        </section>

        <section class="panel">
          <h2>Your cards</h2>
          <div id="empty-state" class="empty-state">
            <div class="empty-icon" aria-hidden="true">
              <img
                src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=120&h=120&fit=crop&q=80"
                alt=""
                width="56"
                height="56"
                crossorigin="anonymous"
              />
              <img
                src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=120&h=120&fit=crop&q=80"
                alt=""
                width="56"
                height="56"
                crossorigin="anonymous"
              />
            </div>
            <p>Fill in the details and hit Generate — your cards will stack up here!</p>
          </div>
          <div id="cards-stack" class="cards-stack" hidden></div>
        </section>
      </div>
    </div>

    <div class="toast" id="toast" role="status">Card saved!</div>

    <script>
      const CAKE_IMG =
        "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=200&h=200&fit=crop&q=80";
      const ROSE_IMG =
        "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=200&h=200&fit=crop&q=80";

      const colors = ["#ff4d6d", "#ffb703", "#c9184a", "#fb8500", "#e07a5f", "#2a9d8f"];
      const confettiEl = document.getElementById("confetti");

      for (let i = 0; i < 40; i++) {
        const piece = document.createElement("span");
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * 12 + "s";
        piece.style.animationDuration = 8 + Math.random() * 10 + "s";
        piece.style.width = 6 + Math.random() * 8 + "px";
        piece.style.height = piece.style.width;
        confettiEl.appendChild(piece);
      }

      const luckyNames = [
        "Alex",
        "Sam",
        "Jordan",
        "Riley",
        "Morgan",
        "Casey",
        "Jamie",
        "Taylor",
        "Quinn",
        "Avery",
        "Charlie",
        "Drew",
      ];

      const luckyHobbies = [
        "gaming",
        "baking",
        "hiking",
        "painting",
        "dancing",
        "photography",
        "gardening",
        "yoga",
        "reading",
        "cooking",
        "cycling",
        "karaoke",
      ];

      const templates = [
        (name, age, hobby) =>
          `Happy ${age}th, ${name}! They say age is just a number — yours is clearly the Wi-Fi password: strong, memorable, and occasionally needs a reset. May your year be filled with more ${hobby} than responsibilities!`,
        (name, age, hobby) =>
          `${name}, you're turning ${age} and still obsessed with ${hobby}? Respect. At this point, ${hobby} isn't a hobby — it's a lifestyle, a personality trait, and probably your retirement plan. Have the best birthday ever!`,
        (name, age, hobby) =>
          `Dear ${name}, congrats on level ${age}! Your main quest this year: maximize ${hobby}, minimize adulting. Side quest: eat cake. You've got this, birthday legend!`,
        (name, age, hobby) =>
          `${name} at ${age}? More like ${age} years of being awesome at ${hobby}! Scientists still can't explain how you make ${hobby} look that good. Wishing you cake, laughs, and zero boring moments!`,
        (name, age, hobby) =>
          `Happy Birthday, ${name}! ${age} candles means ${age} wishes, but let's be honest — you only need one: unlimited time for ${hobby}. May your cake be huge and your ${hobby} skills even huger!`,
        (name, age, hobby) =>
          `${name}, welcome to ${age}! You're not getting older, you're just becoming a more refined version of someone who loves ${hobby}. May your birthday be as epic as your ${hobby} stories!`,
        (name, age, hobby) =>
          `Roses are red, violets are blue, ${name} is ${age} and still crushing ${hobby} too! Here's to another year of being wonderfully, hilariously you. Party on!`,
        (name, age, hobby) =>
          `Breaking news: ${name} turns ${age} today! Eyewitnesses report excessive ${hobby}, dangerous levels of fun, and cake consumption. Stay tuned for more birthday chaos!`,
      ];

      function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function generateMessage(name, age, hobby) {
        const idx = Math.abs(hashCode(name + age + hobby + Date.now())) % templates.length;
        return templates[idx](name, age, hobby);
      }

      function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return hash;
      }

      function formatCardText(name, age, message) {
        return [
          "Happy Birthday!",
          "",
          `Dear ${name},`,
          "",
          message,
          "",
          `${age} years young!`,
          "",
          "With love, cake & roses",
        ].join("\n");
      }

      async function renderCardImage(cardInterior) {
        const canvas = await html2canvas(cardInterior, {
          backgroundColor: "#fffdf9",
          scale: 2,
          useCORS: true,
          logging: false,
        });

        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("Failed to create image"));
          }, "image/png");
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      function createCardElement(name, age, message) {
        const item = document.createElement("article");
        item.className = "card-item";

        item.innerHTML = `
          <div class="card-stage">
            <div class="birthday-card">
              <div class="card-interior">
                <span class="card-ribbon">Happy Birthday!</span>
                <div class="card-left">
                  <div class="card-photos" aria-hidden="true">
                    <img src="${CAKE_IMG}" alt="" width="64" height="64" crossorigin="anonymous" />
                    <img src="${ROSE_IMG}" alt="" width="64" height="64" crossorigin="anonymous" />
                  </div>
                  <p class="age-display">${age}</p>
                  <p class="age-label">years young</p>
                </div>
                <div class="card-right">
                  <p class="greeting">Dear ${escapeHtml(name)},</p>
                  <p class="message">${escapeHtml(message)}</p>
                  <p class="signature">With love, cake &amp; roses</p>
                </div>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button type="button" class="save-btn">Save card to Messages</button>
            <button type="button" class="copy-btn">Copy card &amp; message</button>
          </div>
        `;

        const saveBtn = item.querySelector(".save-btn");
        const copyBtn = item.querySelector(".copy-btn");
        saveBtn.addEventListener("click", () => saveCardToMessages(item, name, age, message, saveBtn));
        copyBtn.addEventListener("click", () => copyCard(item, name, age, message, copyBtn));

        return item;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      async function saveCardToMessages(item, name, age, message, button) {
        const cardInterior = item.querySelector(".card-interior");
        const text = formatCardText(name, age, message);
        const filename = `birthday-card-${name.toLowerCase().replace(/\s+/g, "-")}.png`;

        button.disabled = true;
        button.textContent = "Saving…";

        try {
          const imageBlob = await renderCardImage(cardInterior);
          const file = new File([imageBlob], filename, { type: "image/png" });

          if (navigator.share) {
            const shareData = {
              title: `Happy Birthday, ${name}!`,
              text,
              files: [file],
            };

            if (!navigator.canShare || navigator.canShare(shareData)) {
              await navigator.share(shareData);
              showToast("Card ready — pick Messages to send!");
              return;
            }
          }

          downloadBlob(imageBlob, filename);
          showToast("Card saved! Open Photos, then share to Messages.");
        } catch (err) {
          if (err?.name === "AbortError") return;
          try {
            const imageBlob = await renderCardImage(cardInterior);
            downloadBlob(imageBlob, filename);
            showToast("Card downloaded — share it from your Photos app!");
          } catch {
            showToast("Could not save card — try again");
          }
        } finally {
          button.disabled = false;
          button.textContent = "Save card to Messages";
        }
      }

      async function copyCard(item, name, age, message, button) {
        const cardInterior = item.querySelector(".card-interior");
        const text = formatCardText(name, age, message);

        button.disabled = true;
        button.textContent = "Copying…";

        try {
          const imageBlob = await renderCardImage(cardInterior);
          const textBlob = new Blob([text], { type: "text/plain" });

          if (typeof ClipboardItem !== "undefined" && navigator.clipboard?.write) {
            try {
              await navigator.clipboard.write([
                new ClipboardItem({
                  "text/plain": textBlob,
                  "image/png": imageBlob,
                }),
              ]);
              showToast("Card image & message copied!");
              return;
            } catch {
              // Fall through
            }
          }

          if (navigator.clipboard?.write) {
            await navigator.clipboard.write([new ClipboardItem({ "image/png": imageBlob })]);
            showToast("Card image copied!");
            return;
          }

          await navigator.clipboard.writeText(text);
          showToast("Message copied!");
        } catch {
          try {
            await navigator.clipboard.writeText(text);
            showToast("Message copied!");
          } catch {
            showToast("Could not copy — try Save card to Messages");
          }
        } finally {
          button.disabled = false;
          button.textContent = "Copy card & message";
        }
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function addCard(name, age, hobby) {
        const message = generateMessage(name, age, hobby);
        const card = createCardElement(name, age, message);
        emptyState.hidden = true;
        cardsStack.hidden = false;
        cardsStack.prepend(card);
      }

      const form = document.getElementById("card-form");
      const cardsStack = document.getElementById("cards-stack");
      const emptyState = document.getElementById("empty-state");
      const luckyBtn = document.getElementById("lucky-btn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const age = parseInt(document.getElementById("age").value, 10);
        const hobby = document.getElementById("hobby").value.trim();

        if (!name || !hobby || !age) return;
        addCard(name, age, hobby);
      });

      luckyBtn.addEventListener("click", () => {
        const name = pickRandom(luckyNames);
        const age = Math.floor(Math.random() * 53) + 18;
        const hobby = pickRandom(luckyHobbies);

        document.getElementById("name").value = name;
        document.getElementById("age").value = age;
        document.getElementById("hobby").value = hobby;

        addCard(name, age, hobby);
        showToast(`Lucky pick: ${name}, ${age}, loves ${hobby}!`);
      });
    </script>
  </body>
</html>

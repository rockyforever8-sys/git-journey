<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Card Writer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose: #c9184a;
        --rose-light: #ff4d6d;
        --blush: #fff0f3;
        --gold: #ffb703;
        --cream: #fff8f0;
        --paper: #fffdf9;
        --ink: #4a1942;
        --shadow: rgba(74, 25, 66, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 15%, rgba(255, 77, 109, 0.18), transparent 35%),
          radial-gradient(circle at 90% 80%, rgba(255, 183, 3, 0.15), transparent 30%),
          linear-gradient(160deg, #fff0f3 0%, #fff8f0 40%, #ffe5ec 100%);
        overflow-x: hidden;
      }

      .confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .confetti span {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        opacity: 0.5;
        animation: drift 12s linear infinite;
      }

      @keyframes drift {
        0% {
          transform: translateY(-10vh) rotate(0deg);
        }
        100% {
          transform: translateY(110vh) rotate(720deg);
        }
      }

      @keyframes bounce-in {
        0% {
          opacity: 0;
          transform: translateY(-16px) scale(0.96);
        }
        70% {
          transform: translateY(4px) scale(1.01);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }

      header {
        text-align: center;
        margin-bottom: 36px;
      }

      .hero-images {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
        font-size: 2.6rem;
        line-height: 1;
        animation: wiggle 2.8s ease-in-out infinite;
      }

      .fun-title {
        font-family: "Pacifico", cursive;
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        font-weight: 400;
        margin: 0 0 10px;
        line-height: 1.15;
        background: linear-gradient(90deg, var(--rose), var(--gold), var(--rose-light), var(--rose));
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 4s linear infinite;
        filter: drop-shadow(0 2px 8px rgba(201, 24, 74, 0.2));
      }

      .subtitle {
        margin: 0;
        font-size: 1.05rem;
        color: #8b5a7a;
        font-weight: 600;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 32px;
        align-items: start;
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 16px 48px var(--shadow);
      }

      .panel h2 {
        margin: 0 0 20px;
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--rose);
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #f5d0d9;
        border-radius: 14px;
        font: inherit;
        font-size: 1rem;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--rose-light);
        box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.18);
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 16px 20px;
        border: none;
        border-radius: 16px;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, var(--rose-light), var(--rose));
        box-shadow: 0 8px 24px rgba(201, 24, 74, 0.3);
        transition: transform 0.15s, box-shadow 0.15s;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(201, 24, 74, 0.4);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      .lucky-btn {
        background: linear-gradient(135deg, var(--gold), #fb8500);
        box-shadow: 0 8px 24px rgba(255, 183, 3, 0.35);
      }

      .lucky-btn:hover:not(:disabled) {
        box-shadow: 0 12px 28px rgba(255, 183, 3, 0.45);
      }

      .cards-stack {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .card-item {
        animation: bounce-in 0.45s ease-out;
      }

      .card-stage {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px;
      }

      .birthday-card {
        width: 100%;
        max-width: 560px;
      }

      .card-interior {
        width: 100%;
        min-height: 380px;
        display: grid;
        grid-template-columns: 42% 1fr;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 2px 0 #f0d4c8,
          0 20px 50px rgba(74, 25, 66, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.7);
        background: var(--paper);
        position: relative;
      }

      .card-interior::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(201, 24, 74, 0.2) 15%,
          rgba(201, 24, 74, 0.2) 85%,
          transparent
        );
        transform: translateX(-50%);
        z-index: 2;
        pointer-events: none;
      }

      .card-left,
      .card-right {
        padding: 20px 18px;
        position: relative;
      }

      .card-left {
        background: linear-gradient(165deg, #fff3d6 0%, #ffe8ef 55%, #ffd6e0 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-right: 1px solid rgba(201, 24, 74, 0.15);
        gap: 4px;
        overflow: hidden;
        min-height: 380px;
      }

      .balloon {
        position: absolute;
        width: 28px;
        height: 36px;
        border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
        box-shadow: inset -6px -4px 0 rgba(0, 0, 0, 0.08);
      }

      .balloon::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -18px;
        width: 1px;
        height: 18px;
        background: #8b5a7a;
      }

      .balloon.red { background: #ff4d6d; top: 14px; left: 14px; }
      .balloon.gold { background: #ffb703; top: 8px; right: 18px; transform: rotate(8deg); }
      .balloon.rose { background: #c9184a; bottom: 22px; left: 18px; transform: rotate(-10deg); }

      .card-confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .card-confetti i {
        position: absolute;
        display: block;
        border-radius: 2px;
      }

      .card-left-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .card-left .party-banner {
        margin: 0 0 2px;
        padding: 4px 14px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffb703, #fb8500);
        color: #fff;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        box-shadow: 0 3px 8px rgba(251, 133, 0, 0.35);
      }

      .card-left .art-row {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 6px;
        margin: 2px 0;
      }

      .card-left .art-row svg {
        display: block;
        filter: drop-shadow(0 4px 6px rgba(74, 25, 66, 0.2));
      }

      .card-left .cake-svg {
        width: 88px;
        height: 88px;
      }

      .card-left .rose-svg {
        width: 64px;
        height: 80px;
      }

      .card-left .vibe-text {
        margin: 0;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c9184a;
      }

      .card-left .age-badge {
        min-width: 92px;
        padding: 8px 14px 6px;
        border-radius: 999px;
        background: linear-gradient(135deg, #c9184a, #ff4d6d);
        color: #fff;
        text-align: center;
        box-shadow: 0 6px 14px rgba(201, 24, 74, 0.35);
        margin-top: 2px;
      }

      .card-left .age-display {
        font-family: "Caveat", cursive;
        font-size: 2.3rem;
        font-weight: 700;
        color: #fff;
        margin: 0;
        line-height: 0.9;
      }

      .card-left .age-label {
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #ffe8ef;
        margin: 2px 0 0;
      }

      .card-right {
        background:
          linear-gradient(160deg, rgba(255, 240, 243, 0.6), transparent 55%),
          var(--paper);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 36px;
        padding-bottom: 24px;
      }

      .card-right .greeting {
        font-family: "Caveat", cursive;
        font-size: 1.55rem;
        font-weight: 700;
        color: var(--rose);
        margin: 0 0 10px;
      }

      .card-right .message {
        font-family: "Caveat", cursive;
        font-size: 1.2rem;
        line-height: 1.45;
        color: var(--ink);
        margin: 0 0 16px;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .card-right .signature {
        font-family: "Caveat", cursive;
        font-size: 1.15rem;
        color: #9a6078;
        margin: 0;
        text-align: right;
      }

      .card-ribbon {
        position: absolute;
        top: -6px;
        right: 20px;
        background: linear-gradient(135deg, var(--gold), var(--rose-light));
        color: #fff;
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 6px 12px;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 4px 12px rgba(201, 24, 74, 0.35);
        z-index: 3;
      }

      .card-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .card-actions button {
        margin-top: 0;
        font-size: 0.88rem;
        padding: 12px 10px;
      }

      .save-btn {
        background: linear-gradient(135deg, #2a9d8f, #1d7a6f);
        box-shadow: 0 8px 20px rgba(42, 157, 143, 0.3);
      }

      .copy-btn {
        background: linear-gradient(135deg, #e07a5f, var(--rose));
        box-shadow: 0 8px 20px rgba(224, 122, 95, 0.3);
      }

      .card-actions button:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }

      .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: #b07a8f;
        font-weight: 600;
        line-height: 1.6;
      }

      .empty-state .empty-icon {
        font-size: 2.6rem;
        margin-bottom: 12px;
        letter-spacing: 0.12em;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--ink);
        color: #fff;
        padding: 12px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        opacity: 0;
        transition: transform 0.3s, opacity 0.3s;
        z-index: 100;
        pointer-events: none;
        max-width: 90vw;
        text-align: center;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="confetti" aria-hidden="true" id="confetti"></div>

    <div class="page">
      <header>
        <div class="hero-images" aria-hidden="true">🎂 🌹 🎈</div>
        <h1 class="fun-title">Wit &amp; Wishes Card Factory</h1>
        <p class="subtitle">Cake, roses &amp; laughs — birthday cards with serious good vibes</p>
      </header>

      <div class="layout">
        <section class="panel">
          <h2>Tell us about the birthday star</h2>
          <form id="card-form">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" placeholder="e.g. Alex" required />
            </div>
            <div class="field">
              <label for="age">Age</label>
              <input id="age" name="age" type="number" min="1" max="120" placeholder="e.g. 30" required />
            </div>
            <div class="field">
              <label for="hobby">Hobby</label>
              <input id="hobby" name="hobby" type="text" placeholder="e.g. baking, hiking, gaming" required />
            </div>
            <button type="submit">Generate Funny Message</button>
            <button type="button" class="lucky-btn" id="lucky-btn">I'm Feeling Lucky</button>
          </form>
        </section>

        <section class="panel">
          <h2>Your cards</h2>
          <div id="empty-state" class="empty-state">
            <div class="empty-icon" aria-hidden="true">🎂 🌹 ✨</div>
            <p>Fill in the details and hit Generate — your cards will stack up here!</p>
          </div>
          <div id="cards-stack" class="cards-stack" hidden></div>
        </section>
      </div>
    </div>

    <div class="toast" id="toast" role="status">Card saved!</div>

    <script>
      const colors = ["#ff4d6d", "#ffb703", "#c9184a", "#fb8500", "#e07a5f", "#2a9d8f"];
      const confettiEl = document.getElementById("confetti");

      for (let i = 0; i < 40; i++) {
        const piece = document.createElement("span");
        piece.style.left = Math.random() * 100 + "%";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * 12 + "s";
        piece.style.animationDuration = 8 + Math.random() * 10 + "s";
        piece.style.width = 6 + Math.random() * 8 + "px";
        piece.style.height = piece.style.width;
        confettiEl.appendChild(piece);
      }

      const luckyNames = [
        "Alex",
        "Sam",
        "Jordan",
        "Riley",
        "Morgan",
        "Casey",
        "Jamie",
        "Taylor",
        "Quinn",
        "Avery",
        "Charlie",
        "Drew",
      ];

      const luckyHobbies = [
        "gaming",
        "baking",
        "hiking",
        "painting",
        "dancing",
        "photography",
        "gardening",
        "yoga",
        "reading",
        "cooking",
        "cycling",
        "karaoke",
      ];

      const templates = [
        (name, age, hobby) =>
          `Happy ${age}th, ${name}! They say age is just a number — yours is clearly the Wi-Fi password: strong, memorable, and occasionally needs a reset. May your year be filled with more ${hobby} than responsibilities!`,
        (name, age, hobby) =>
          `${name}, you're turning ${age} and still obsessed with ${hobby}? Respect. At this point, ${hobby} isn't a hobby — it's a lifestyle, a personality trait, and probably your retirement plan. Have the best birthday ever!`,
        (name, age, hobby) =>
          `Dear ${name}, congrats on level ${age}! Your main quest this year: maximize ${hobby}, minimize adulting. Side quest: eat cake. You've got this, birthday legend!`,
        (name, age, hobby) =>
          `${name} at ${age}? More like ${age} years of being awesome at ${hobby}! Scientists still can't explain how you make ${hobby} look that good. Wishing you cake, laughs, and zero boring moments!`,
        (name, age, hobby) =>
          `Happy Birthday, ${name}! ${age} candles means ${age} wishes, but let's be honest — you only need one: unlimited time for ${hobby}. May your cake be huge and your ${hobby} skills even huger!`,
        (name, age, hobby) =>
          `${name}, welcome to ${age}! You're not getting older, you're just becoming a more refined version of someone who loves ${hobby}. May your birthday be as epic as your ${hobby} stories!`,
        (name, age, hobby) =>
          `Roses are red, violets are blue, ${name} is ${age} and still crushing ${hobby} too! Here's to another year of being wonderfully, hilariously you. Party on!`,
        (name, age, hobby) =>
          `Breaking news: ${name} turns ${age} today! Eyewitnesses report excessive ${hobby}, dangerous levels of fun, and cake consumption. Stay tuned for more birthday chaos!`,
      ];

      function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function generateMessage(name, age, hobby) {
        const idx = Math.abs(hashCode(name + age + hobby + Date.now())) % templates.length;
        return templates[idx](name, age, hobby);
      }

      function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return hash;
      }

      function formatCardText(name, age, message) {
        return [
          "Happy Birthday!",
          "",
          `Dear ${name},`,
          "",
          message,
          "",
          `${age} years young!`,
          "",
          "With love, cake & roses",
        ].join("\n");
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      const confettiPieces = [
        { top: "8%", left: "10%", w: 7, h: 7, color: "#ff4d6d", rot: 18 },
        { top: "14%", left: "78%", w: 6, h: 6, color: "#ffb703", rot: -24 },
        { top: "22%", left: "42%", w: 5, h: 5, color: "#c9184a", rot: 45 },
        { top: "6%", left: "55%", w: 6, h: 6, color: "#fb8500", rot: -12 },
        { top: "72%", left: "8%", w: 7, h: 7, color: "#ffd166", rot: 30 },
        { top: "80%", left: "72%", w: 6, h: 6, color: "#ff4d6d", rot: -35 },
        { top: "68%", left: "38%", w: 5, h: 5, color: "#2a9d8f", rot: 12 },
        { top: "88%", left: "52%", w: 6, h: 6, color: "#c9184a", rot: 55 },
        { top: "38%", left: "6%", w: 5, h: 5, color: "#fb8500", rot: -8 },
        { top: "48%", left: "86%", w: 7, h: 7, color: "#ffb703", rot: 22 },
        { top: "30%", left: "88%", w: 5, h: 5, color: "#ff8fab", rot: -40 },
        { top: "58%", left: "14%", w: 6, h: 6, color: "#e07a5f", rot: 16 },
        { top: "18%", left: "24%", w: 5, h: 5, color: "#ffd166", rot: -18 },
        { top: "92%", left: "22%", w: 5, h: 5, color: "#ff4d6d", rot: 28 },
        { top: "52%", left: "78%", w: 5, h: 5, color: "#c9184a", rot: -15 },
      ];

      function confettiHtml() {
        return `<div class="card-confetti" aria-hidden="true">${confettiPieces
          .map(
            (p) =>
              `<i style="top:${p.top};left:${p.left};width:${p.w}px;height:${p.h}px;background:${p.color};transform:rotate(${p.rot}deg)"></i>`
          )
          .join("")}</div>`;
      }

      const cakeSvg = `
        <svg class="cake-svg" viewBox="0 0 120 120" aria-hidden="true">
          <ellipse cx="60" cy="110" rx="50" ry="7" fill="#e8c9b0"/>
          <rect x="24" y="78" width="72" height="26" rx="5" fill="#f4a261"/>
          <rect x="24" y="73" width="72" height="10" rx="4" fill="#fff5f0"/>
          <rect x="32" y="56" width="56" height="22" rx="4" fill="#e76f51"/>
          <rect x="32" y="51" width="56" height="10" rx="4" fill="#fff5f0"/>
          <rect x="40" y="36" width="40" height="18" rx="4" fill="#f4a261"/>
          <rect x="40" y="31" width="40" height="10" rx="4" fill="#fff5f0"/>
          <rect x="50" y="16" width="4" height="16" fill="#ffd166"/>
          <rect x="58" y="12" width="4" height="20" fill="#ffd166"/>
          <rect x="66" y="16" width="4" height="16" fill="#ffd166"/>
          <ellipse cx="52" cy="13" rx="5" ry="6" fill="#ff4d6d"/>
          <ellipse cx="60" cy="9" rx="5" ry="6" fill="#ffb703"/>
          <ellipse cx="68" cy="13" rx="5" ry="6" fill="#ff4d6d"/>
          <circle cx="34" cy="62" r="2.5" fill="#c9184a"/>
          <circle cx="78" cy="64" r="2" fill="#2a9d8f"/>
          <circle cx="48" cy="44" r="2" fill="#ffb703"/>
          <circle cx="68" cy="42" r="2.5" fill="#c9184a"/>
          <circle cx="56" cy="88" r="2" fill="#ff4d6d"/>
        </svg>`;

      const roseSvg = `
        <svg class="rose-svg" viewBox="0 0 80 100" aria-hidden="true">
          <path d="M40 96 Q36 72 40 52" stroke="#2a9d8f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="32" cy="74" rx="11" ry="5" fill="#52b788" transform="rotate(-28 32 74)"/>
          <ellipse cx="50" cy="66" rx="10" ry="5" fill="#40916c" transform="rotate(22 50 66)"/>
          <circle cx="40" cy="30" r="20" fill="#c9184a"/>
          <circle cx="30" cy="26" r="12" fill="#ff4d6d"/>
          <circle cx="50" cy="24" r="11" fill="#e63946"/>
          <circle cx="40" cy="18" r="9" fill="#ff758f"/>
          <circle cx="36" cy="32" r="7" fill="#c9184a"/>
          <circle cx="46" cy="34" r="6" fill="#ff4d6d"/>
        </svg>`;

      function leftPanelHtml(age) {
        return `
          ${confettiHtml()}
          <span class="balloon red" aria-hidden="true"></span>
          <span class="balloon gold" aria-hidden="true"></span>
          <span class="balloon rose" aria-hidden="true"></span>
          <div class="card-left-content">
            <p class="party-banner">Party time</p>
            <p class="vibe-text">Good vibes only</p>
            <div class="art-row">
              ${cakeSvg}
              ${roseSvg}
            </div>
            <div class="age-badge">
              <p class="age-display">${age}</p>
              <p class="age-label">years young</p>
            </div>
          </div>`;
      }

      function wrapCanvasText(ctx, text, maxWidth) {
        const words = text.split(/\s+/);
        const lines = [];
        let current = "";

        for (const word of words) {
          const test = current ? `${current} ${word}` : word;
          if (ctx.measureText(test).width > maxWidth && current) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }

        if (current) lines.push(current);
        return lines;
      }

      function drawRoundRect(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function drawBalloon(ctx, x, y, color) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x, y, 22, 28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.beginPath();
        ctx.ellipse(x - 7, y - 8, 6, 9, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#8b5a7a";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y + 28);
        ctx.quadraticCurveTo(x + 4, y + 48, x, y + 62);
        ctx.stroke();
        ctx.restore();
      }

      function drawCake(ctx, x, y) {
        ctx.save();
        ctx.fillStyle = "#e8c9b0";
        ctx.beginPath();
        ctx.ellipse(x, y + 78, 52, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f4a261";
        drawRoundRect(ctx, x - 38, y + 46, 76, 28, 6);
        ctx.fill();
        ctx.fillStyle = "#fff5f0";
        drawRoundRect(ctx, x - 38, y + 40, 76, 12, 5);
        ctx.fill();
        ctx.fillStyle = "#e76f51";
        drawRoundRect(ctx, x - 28, y + 22, 56, 22, 5);
        ctx.fill();
        ctx.fillStyle = "#fff5f0";
        drawRoundRect(ctx, x - 28, y + 16, 56, 10, 4);
        ctx.fill();
        ctx.fillStyle = "#f4a261";
        drawRoundRect(ctx, x - 18, y + 2, 36, 16, 4);
        ctx.fill();
        ctx.fillStyle = "#fff5f0";
        drawRoundRect(ctx, x - 18, y - 4, 36, 10, 4);
        ctx.fill();
        const candles = [
          [x - 10, y - 22, "#ff4d6d"],
          [x, y - 28, "#ffb703"],
          [x + 10, y - 22, "#ff4d6d"],
        ];
        for (const [cx, cy, flame] of candles) {
          ctx.fillStyle = "#ffd166";
          ctx.fillRect(cx - 2, cy + 8, 4, 16);
          ctx.fillStyle = flame;
          ctx.beginPath();
          ctx.ellipse(cx, cy + 4, 4, 6, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function paintSavedCard(name, age, message) {
        const width = 1200;
        const leftW = 500;
        const pad = 48;
        const measure = document.createElement("canvas").getContext("2d");
        measure.font = "700 36px Caveat, cursive, sans-serif";
        const greeting = `Dear ${name},`;
        const bodyLines = wrapCanvasText(measure, message, width - leftW - pad * 2);
        measure.font = "28px Caveat, cursive, sans-serif";
        const sign = "With love, cake & roses";
        const textHeight = 70 + bodyLines.length * 44 + 70;
        const height = Math.max(720, textHeight + 80);

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");

        const leftGrad = ctx.createLinearGradient(0, 0, leftW, height);
        leftGrad.addColorStop(0, "#fff3d6");
        leftGrad.addColorStop(0.55, "#ffe8ef");
        leftGrad.addColorStop(1, "#ffd6e0");
        ctx.fillStyle = leftGrad;
        ctx.fillRect(0, 0, leftW, height);

        ctx.fillStyle = "#fffdf9";
        ctx.fillRect(leftW, 0, width - leftW, height);

        const confetti = [
          [40, 40, "#ff4d6d"], [120, 90, "#ffb703"], [220, 50, "#c9184a"],
          [80, 180, "#fb8500"], [300, 140, "#ffd166"], [360, 80, "#ff4d6d"],
          [60, 320, "#2a9d8f"], [400, 260, "#c9184a"], [180, 280, "#ff8fab"],
          [90, 480, "#ffb703"], [340, 420, "#ff4d6d"], [250, 520, "#fb8500"],
          [430, 560, "#ffd166"], [30, 600, "#e07a5f"], [150, 640, "#c9184a"],
          [380, 640, "#ff4d6d"], [280, 200, "#2a9d8f"], [420, 180, "#ffb703"],
        ];
        for (const [cx, cy, color] of confetti) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(0.4);
          ctx.fillStyle = color;
          ctx.fillRect(-6, -6, 12, 12);
          ctx.restore();
        }

        drawBalloon(ctx, 70, 90, "#ff4d6d");
        drawBalloon(ctx, 420, 80, "#ffb703");
        drawBalloon(ctx, 90, height - 140, "#c9184a");

        ctx.fillStyle = "#ffb703";
        drawRoundRect(ctx, leftW / 2 - 90, 70, 180, 36, 18);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "800 18px Nunito, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("PARTY TIME", leftW / 2, 94);

        ctx.fillStyle = "#c9184a";
        ctx.font = "800 16px Nunito, sans-serif";
        ctx.fillText("GOOD VIBES ONLY", leftW / 2, 130);

        drawCake(ctx, leftW / 2, 210);

        const badgeY = 430;
        const badgeGrad = ctx.createLinearGradient(leftW / 2 - 80, badgeY, leftW / 2 + 80, badgeY + 80);
        badgeGrad.addColorStop(0, "#c9184a");
        badgeGrad.addColorStop(1, "#ff4d6d");
        ctx.fillStyle = badgeGrad;
        drawRoundRect(ctx, leftW / 2 - 80, badgeY, 160, 86, 43);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 52px Caveat, cursive, sans-serif";
        ctx.fillText(String(age), leftW / 2, badgeY + 50);
        ctx.font = "800 14px Nunito, sans-serif";
        ctx.fillText("YEARS YOUNG", leftW / 2, badgeY + 72);

        ctx.strokeStyle = "rgba(201, 24, 74, 0.25)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(leftW, 0);
        ctx.lineTo(leftW, height);
        ctx.stroke();

        const ribbonGrad = ctx.createLinearGradient(width - 280, 0, width - 40, 0);
        ribbonGrad.addColorStop(0, "#ffb703");
        ribbonGrad.addColorStop(1, "#ff4d6d");
        ctx.fillStyle = ribbonGrad;
        drawRoundRect(ctx, width - 280, 0, 220, 48, 12);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "800 16px Nunito, sans-serif";
        ctx.fillText("HAPPY BIRTHDAY!", width - 170, 30);

        let ty = 90;
        ctx.textAlign = "left";
        ctx.fillStyle = "#c9184a";
        ctx.font = "700 42px Caveat, cursive, sans-serif";
        ctx.fillText(greeting, leftW + pad, ty);
        ty += 58;

        ctx.fillStyle = "#4a1942";
        ctx.font = "36px Caveat, cursive, sans-serif";
        for (const line of bodyLines) {
          ctx.fillText(line, leftW + pad, ty);
          ty += 44;
        }

        ctx.fillStyle = "#9a6078";
        ctx.font = "28px Caveat, cursive, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(sign, width - pad, height - 40);

        return canvas;
      }

      async function renderCardImage(_cardInterior, name, age, message) {
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }

        const canvas = paintSavedCard(name, age, message);
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("Failed to create image"));
          }, "image/png");
        });
      }

      function createCardElement(name, age, message) {
        const item = document.createElement("article");
        item.className = "card-item";

        item.innerHTML = `
          <div class="card-stage">
            <div class="birthday-card">
              <div class="card-interior">
                <span class="card-ribbon">Happy Birthday!</span>
                <div class="card-left">
                  ${leftPanelHtml(age)}
                </div>
                <div class="card-right">
                  <p class="greeting">Dear ${escapeHtml(name)},</p>
                  <p class="message">${escapeHtml(message)}</p>
                  <p class="signature">With love, cake &amp; roses</p>
                </div>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button type="button" class="save-btn">Save card to Messages</button>
            <button type="button" class="copy-btn">Copy card &amp; message</button>
          </div>
        `;

        const saveBtn = item.querySelector(".save-btn");
        const copyBtn = item.querySelector(".copy-btn");
        saveBtn.addEventListener("click", () => saveCardToMessages(item, name, age, message, saveBtn));
        copyBtn.addEventListener("click", () => copyCard(item, name, age, message, copyBtn));

        return item;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      async function saveCardToMessages(item, name, age, message, button) {
        const cardInterior = item.querySelector(".card-interior");
        const text = formatCardText(name, age, message);
        const filename = `birthday-card-${name.toLowerCase().replace(/\s+/g, "-")}.png`;

        button.disabled = true;
        button.textContent = "Saving…";

        try {
          const imageBlob = await renderCardImage(cardInterior, name, age, message);
          const file = new File([imageBlob], filename, { type: "image/png" });

          if (navigator.share) {
            const shareData = {
              title: `Happy Birthday, ${name}!`,
              text,
              files: [file],
            };

            if (!navigator.canShare || navigator.canShare(shareData)) {
              await navigator.share(shareData);
              showToast("Card ready — pick Messages to send!");
              return;
            }
          }

          downloadBlob(imageBlob, filename);
          showToast("Card saved! Open Photos, then share to Messages.");
        } catch (err) {
          if (err?.name === "AbortError") return;
          try {
            const imageBlob = await renderCardImage(cardInterior, name, age, message);
            downloadBlob(imageBlob, filename);
            showToast("Card downloaded — share it from your Photos app!");
          } catch {
            showToast("Could not save card — try again");
          }
        } finally {
          button.disabled = false;
          button.textContent = "Save card to Messages";
        }
      }

      async function copyCard(item, name, age, message, button) {
        const cardInterior = item.querySelector(".card-interior");
        const text = formatCardText(name, age, message);

        button.disabled = true;
        button.textContent = "Copying…";

        try {
          const imageBlob = await renderCardImage(cardInterior, name, age, message);
          const textBlob = new Blob([text], { type: "text/plain" });

          if (typeof ClipboardItem !== "undefined" && navigator.clipboard?.write) {
            try {
              await navigator.clipboard.write([
                new ClipboardItem({
                  "text/plain": textBlob,
                  "image/png": imageBlob,
                }),
              ]);
              showToast("Card image & message copied!");
              return;
            } catch {
              // Fall through
            }
          }

          if (navigator.clipboard?.write) {
            await navigator.clipboard.write([new ClipboardItem({ "image/png": imageBlob })]);
            showToast("Card image copied!");
            return;
          }

          await navigator.clipboard.writeText(text);
          showToast("Message copied!");
        } catch {
          try {
            await navigator.clipboard.writeText(text);
            showToast("Message copied!");
          } catch {
            showToast("Could not copy — try Save card to Messages");
          }
        } finally {
          button.disabled = false;
          button.textContent = "Copy card & message";
        }
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function addCard(name, age, hobby) {
        const message = generateMessage(name, age, hobby);
        const card = createCardElement(name, age, message);
        emptyState.hidden = true;
        cardsStack.hidden = false;
        cardsStack.prepend(card);
      }

      const form = document.getElementById("card-form");
      const cardsStack = document.getElementById("cards-stack");
      const emptyState = document.getElementById("empty-state");
      const luckyBtn = document.getElementById("lucky-btn");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const age = parseInt(document.getElementById("age").value, 10);
        const hobby = document.getElementById("hobby").value.trim();

        if (!name || !hobby || !age) return;
        addCard(name, age, hobby);
      });

      luckyBtn.addEventListener("click", () => {
        const name = pickRandom(luckyNames);
        const age = Math.floor(Math.random() * 53) + 18;
        const hobby = pickRandom(luckyHobbies);

        document.getElementById("name").value = name;
        document.getElementById("age").value = age;
        document.getElementById("hobby").value = hobby;

        addCard(name, age, hobby);
        showToast(`Lucky pick: ${name}, ${age}, loves ${hobby}!`);
      });
    </script>
  </body>

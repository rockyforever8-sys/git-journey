<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>git-journey dashboards</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b1220;
        color: #f8fafc;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: #111827;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { color: #94a3b8; line-height: 1.6; margin: 0 0 20px; }
      a {
        display: block;
        text-decoration: none;
        color: #0b1220;
        background: #38bdf8;
        border-radius: 14px;
        padding: 14px 16px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      a.secondary {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Dashboards</h1>
      <p>Choose an app to open. Both work in your phone browser — no install needed.</p>
      <a href="/git-journey/ml-agent-dashboard/">ML Agent Dashboard</a>
      <a class="secondary" href="/git-journey/hk-ib-dashboard/">Hong Kong Universities IB Dashboard</a>
    </div>
  </body>
</html>
